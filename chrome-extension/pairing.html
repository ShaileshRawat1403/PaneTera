<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect PaneTera Browser Operator</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #171411;
      color: #f2ede5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(520px, 100%);
      padding: 32px;
      border: 1px solid #3b342d;
      border-radius: 16px;
      background: #201c18;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .32);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #b9a89a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; }
    p { margin: 0 0 16px; color: #c9beb2; line-height: 1.55; }
    .scope {
      margin: 24px 0;
      padding: 16px;
      border-left: 3px solid #9d7ad9;
      background: #29231f;
      color: #ded5cc;
      line-height: 1.5;
    }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    button {
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid #4b4138;
      border-radius: 9px;
      background: transparent;
      color: #f2ede5;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button.primary { border-color: #8f6bc8; background: #7654ad; }
    button:disabled { cursor: wait; opacity: .55; }
    #status { min-height: 24px; color: #d2aa67; }
    #status.success { color: #82bc91; }
    #status.error { color: #e58c84; }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <p class="eyebrow">PaneTera Browser Operator</p>
    <h1 id="title">Allow this local connection?</h1>
    <p>PaneTera is requesting access to its Browser Operator on this device.</p>
    <div class="scope">
      This connects the extension to your local PaneTera instance. Browser observations remain governed and appear in PaneTera Activity and Audit.
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="btnApprovePairing" class="primary">Allow connection</button>
      <button id="btnDismissPairing">Not now</button>
    </div>
  </main>
  <script src="pairing.js" type="module"></script>
</body>
</html>
