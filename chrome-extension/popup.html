<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      margin: 0;
      padding: 16px;
      width: 280px;
    }
    h3 {
      font-size: 14px;
      font-weight: 800;
      color: #f4f4f5;
      margin: 0 0 12px 0;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: #b794f4;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 700;
      border-radius: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .status-disconnected {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .status-connected {
      background: rgba(34, 197, 94, 0.1);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      font-size: 10px;
      font-weight: 600;
      color: #71717a;
      display: block;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 8px;
      box-sizing: border-box;
      color: #f4f4f5;
      font-size: 12px;
      font-family: monospace;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #7f5af0;
    }
    button {
      width: 100%;
      background: #7f5af0;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    button:hover {
      background: #6d47dd;
    }
    button:disabled {
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.3);
      cursor: not-allowed;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    .info-box {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 10px;
      line-height: 1.4;
      color: #a1a1aa;
    }
    .error-msg {
      color: #ef4444;
      font-size: 10px;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <h3>Tessera Operator</h3>
  
  <div id="statusBadge" class="status-badge status-disconnected">Checking Gateway...</div>

  <!-- Disconnected State Panel -->
  <div id="setupPanel" style="display: none;">
    <div class="info-box">
      Enter the 8-character pairing code generated in the Tessera Workbench dashboard to authorize this extension connection.
    </div>
    <div class="input-group">
      <label>Pairing Code</label>
      <input type="text" id="pairingCode" placeholder="XXXX-XXXX" maxlength="9">
    </div>
    <button id="btnConnect">Connect Operator</button>
    <div id="errorMsg" class="error-msg"></div>
  </div>

  <!-- Connected State Panel -->
  <div id="actionPanel" style="display: none;">
    <div class="info-box">
      <strong>Active Mode:</strong> Governed Read-Only<br/>
      Observations will be routed to the Workbench Intelligence Feed.
    </div>
    <div class="input-group" style="margin-bottom: 12px;">
      <label>Action</label>
      <select id="capabilitySelect" style="width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; padding:10px; color:#f4f4f5; font-size:12px; margin-bottom:10px;">
        <option value="browser.page.observe">Observe Page (Phase 1)</option>
        <option value="browser.article.extract">Extract Article</option>
        <option value="browser.outline.extract">Extract Outline</option>
        <option value="browser.table.extract">Extract Tables</option>
        <option value="browser.links.extract">Extract Links</option>
        <option value="browser.metadata.extract">Extract Metadata</option>
        <option value="browser.structuredData.extract">Extract Structured Data (JSON-LD)</option>
        <option value="browser.codeBlocks.extract">Extract Code Blocks</option>
      </select>
    </div>
    <button id="btnCapture">Execute Action</button>
    <button id="btnOpenSidePanel" class="btn-secondary">Open Tessera Side Panel</button>
    <button id="btnDisconnect" class="btn-secondary" style="border-color: rgba(239, 68, 68, 0.2); color: #ef4444;">Disconnect</button>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
