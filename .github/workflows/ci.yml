name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · test:core · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint (eslint + tsc)
        run: npm run lint

      # test:core excludes the quarantined suites (see docs triage table).
      # The default `npm test` stays red by design until they are fixed, so CI
      # gates on test:core, not test.
      - name: Test (core suite)
        run: npm run test:core

      - name: Build
        run: npm run build

      # Software bill of materials for release provenance and vuln tracking.
      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 30

  # Secret scanning on every push/PR. Gitleaks is free for public repositories.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Separate job so a browser flake never blocks the unit/lint/build signal.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The config's webServer boots `npm run dev` with this token and waits for
      # the client. A dummy model key keeps startup happy without live calls.
      - name: Run E2E journeys
        run: npm run test:e2e
        env:
          PORTAL_TOKEN: e2e-local-token
          GEMINI_API_KEY: e2e-not-used

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
