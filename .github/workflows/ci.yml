name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · test:core · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint (eslint + tsc)
        run: npm run lint

      # test:core excludes the quarantined suites (see docs triage table).
      # The default `npm test` stays red by design until they are fixed, so CI
      # gates on test:core, not test.
      - name: Test (core suite)
        run: npm run test:core

      - name: Build
        run: npm run build
