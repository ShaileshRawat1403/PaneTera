version: 2
updates:
  # Root app + server dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"

  # The browser-operator extension has its own manifest.
  - package-ecosystem: "npm"
    directory: "/chrome-extension"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Keep the CI actions themselves current and patched.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
